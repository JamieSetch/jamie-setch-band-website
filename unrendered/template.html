    <script type="module" src="javascript/main.js"></script>

    <div class="signup-banner" id="signup-banner" onclick="site.navigateTo('sign-up')">
        <canvas id="murmuration" class="murmuration"></canvas>
        <span class="signup-banner-text">Become a Starling</span>
    </div>

    <script>
    (function () {
        // ── Two flocks streaming out from the centre of the banner ──
        const canvas  = document.getElementById('murmuration');
        const ctx     = canvas.getContext('2d');
        const dpr     = window.devicePixelRatio || 1;

        // The favicon is a flying-starling silhouette — reuse it as the bird sprite.
        const birdImg = new Image();
        let birdReady = false;
        birdImg.onload = function () { birdReady = true; };
        birdImg.src = '/favicon.ico';
        const BIRD_AR = 280 / 260;   // native height / width

        let W = 0, H = 0, emitLX = 0, emitRX = 0, emitY = 0, MAXD = 600;

        function resize() {
            W = canvas.clientWidth;
            H = canvas.clientHeight;
            canvas.width  = W * dpr;
            canvas.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            // Both flocks start a little either side of centre, then stream outward.
            emitLX = W / 2 - W * 0.06;
            emitRX = W / 2 + W * 0.06;
            emitY  = H / 2;
            MAXD   = W * 0.95;   // travel distance — enough to clear the outer edge
        }

        const N = 240;
        const birds = [];
        function spawn(b) {
            // Starts near the centre (p≈0) and flies outward toward its edge (p→1).
            b.p  = 0;
            b.speed = 0.0012 + Math.random() * 0.0013;   // very slow, drifting
            b.jx = (Math.random() - 0.5) * 26;            // little cloud around the origin
            b.jy = (Math.random() - 0.5) * 14;
            b.oy = (Math.random() - 0.5);                 // vertical fan as it travels
            b.phase = Math.random() * Math.PI * 2;
            b.flapSpeed = 0.26 + Math.random() * 0.18;
            b.seed = Math.random() * 1000;
            return b;
        }
        for (var i = 0; i < N; i++) {
            var b = spawn({});
            b.side = (i % 2 === 0) ? -1 : 1;              // half left, half right
            b.p = Math.random();                          // stagger so the stream is continuous
            birds.push(b);
        }

        let t = 0;
        function tick() {
            t++;
            ctx.clearRect(0, 0, W, H);

            // Draw the youngest (smallest) first so nearer birds overlap on top.
            birds.sort(function (a, c) { return a.p - c.p; });

            for (var i = 0; i < N; i++) {
                var b = birds[i];
                b.p += b.speed;
                if (b.p >= 1) { spawn(b); continue; }

                var ease = b.p * b.p;                       // accelerate outward + toward viewer
                var dist = ease * MAXD;
                var origin = (b.side < 0) ? emitLX : emitRX;
                var sx = origin + b.side * dist + b.jx;
                var sy = emitY + b.oy * dist * 0.14 + b.jy
                       + Math.sin(t * 0.03 + b.seed) * 2;   // soft murmuration sway
                var s  = 1.5 + ease * 12;                   // grows as it nears the viewer (a bit bigger)

                var alpha = Math.min(1, b.p / 0.10) * Math.min(1, (1 - b.p) / 0.18);
                ctx.globalAlpha = Math.max(0, alpha);

                if (!birdReady) {            // sprite not loaded yet — faint placeholder dot
                    ctx.fillStyle = 'rgba(170,160,70,0.9)';
                    ctx.fillRect(sx - 1, sy - 1, 2, 2);
                    continue;
                }

                // Flap by squashing the spread-wing starling vertically (down/up stroke).
                var flap = 0.5 + 0.5 * Math.sin(t * b.flapSpeed + b.phase); // 0..1
                var w = s * 2.6;
                var h = w * BIRD_AR * (0.45 + 0.55 * flap);
                ctx.save();
                ctx.translate(sx, sy);
                if (b.side < 0) ctx.scale(-1, 1);   // mirror so it faces its flight direction
                ctx.drawImage(birdImg, -w / 2, -h / 2, w, h);
                ctx.restore();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(tick);
        }
        resize();
        window.addEventListener('resize', resize);
        tick();

        // ── Show banner only while the Music page is the visible one ───────
        // Nav clicks call main.js's internal navigateTo (not site.navigateTo),
        // so we watch the page divs directly — robust to any navigation path.
        var banner = document.getElementById('signup-banner');
        function visiblePageId() {
            var el = document.querySelector('.page:not(.hidden)');
            return el ? el.id : '';
        }
        function updateBanner() {
            banner.style.transform = (visiblePageId() === 'music') ? 'translateY(0)' : 'translateY(100%)';
        }
        var mo = new MutationObserver(updateBanner);
        document.querySelectorAll('.page').forEach(function (p) {
            mo.observe(p, { attributes: true, attributeFilter: ['class'] });
        });
        updateBanner();
        window.addEventListener('popstate', updateBanner);
    })();
    </script>
</body>
</html>

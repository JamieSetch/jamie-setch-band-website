<div class="{{HIDDEN}} page" data-nav="{{SHOW_NAV}}" id="starling-signup">
    <div class="ss-card">
        <button class="ss-close" onclick="site.navigateTo('music')" type="button" aria-label="Close">&times;</button>
        <div class="ss-body">
            <h3>Before you go,<br>sign up to the newsletter</h3>
            <p>Be the first to hear about exclusive news, music and events from Jamie Setch.</p>
            <form class="ss-form" onsubmit="return site.subscribeStarling(this)">
                <input type="email" class="ss-input" placeholder="Enter your email address" required>
                <button type="submit" class="ss-subscribe">Subscribe</button>
            </form>
        </div>
        <div class="ss-success hidden">
            <h3>You're in.</h3>
            <p>Welcome to the flock. Watch your inbox to confirm your subscription.</p>
        </div>
    </div>
</div>
